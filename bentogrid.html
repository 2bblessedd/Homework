<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bento Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<style>
body {
  margin: 0;
  padding: 20px;
  background-color: #0b0b0b;
  font-family: sans-serif;
  color: #fff;
  display: flex;
  justify-content: center;
}
.bento-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: minmax(140px, auto); 
  gap: 15px;
  max-width: 1200px;
  width: 100%;
}
.tile {
  position: relative;
  background-color: #1a1a1a;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.tile-title {
  position: absolute;
  top: 15px;
  left: 15px;
  font-size: 16px;
  font-weight: bold;
}
.tile.large {
  grid-column: span 2;
  grid-row: span 2;
}
.tile.wide {
  grid-column: span 2;
}
.tile.tall {
  grid-row: span 2;
}
</style>
<body>

  <div class="bento-grid">
    <div class="tile">
      <img src="https://static.vecteezy.com/system/resources/previews/022/792/120/non_2x/olympic-games-official-symbol-logo-white-abstract-design-with-black-background-free-vector.jpg">
      <div class="tile-title">Я люблю спорт</div>
    </div>

    <div class="tile">
      <img src="https://azeraskerov.az/wp-content/uploads/2024/10/judoday.jpg" alt="Дзюдо">
      <div class="tile-title">Я занимался дзюдошкой 9 лет</div>
    </div>
    
    <div class="tile">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTs7Sap03wMiFboS4VSfnXHY1yj6kvAJf1aFsyaTd7OgIfaxv5cquoveW0&s=10" alt="MMA">
      <div class="tile-title">Занимался ММА 1 год</div>
    </div>

    <div class="tile">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcREDd_XXkvsXfT2DKCsE3vHfa9pQwVY13w63StQgpg1uCE270pLwQzCkDs&s=10" alt="Больно">
      <div class="tile-title">Травмировался(((</div>
    </div>
    
    <div class="tile">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSQ4zOztSvbGqaHDzh5_i-iXa47ambt0V37DsCH1tyP4g&s=10" alt="Играю типо">
      <div class="tile-title">Я играю сильно</div>
    </div>

    <div class="tile large">
      <img src="https://i.pinimg.com/736x/04/ad/70/04ad70cb1bde4af2526eb614982cf3eb.jpg" alt="аватарка моя в тг">
      <div class="tile-title">Я Даня это моя аватарка в тг</div>
    </div>

    <div class="tile">
      <img src="https://i.pinimg.com/736x/62/11/9e/62119ec92eb462b73e7e7b564eb49a7f.jpg" alt="Mortal Kombat">
      <div class="tile-title">Мой любимый файтинг - это Mortal Kombat</div>
    </div>
    
    <div class="tile tall">
      <img src="https://i.pinimg.com/736x/53/b3/5e/53b35e9eeaea8f34b28be94e4237b9a7.jpg" alt="R6 Siege">
      <div class="tile-title">Это мой любимый шутанчик — Tom Clancy's Rainbow Six Siege</div>
    </div>

    <div class="tile wide">
      <img src="https://play-lh.googleusercontent.com/FF7TA9o2BLc6V8JVyDt18QfLuj1gaIfWScMUUNV4gBHNBLDRSeOWA0004c99QJJmq4Z5b8K02r0_0YNPSCE-Gw=w240-h480-rw" alt="Frank by Basta">
      <div class="tile-title">Там очень вкусно</div>
    </div>
    
    <div class="tile">
      <img src="https://i.pinimg.com/1200x/87/ee/76/87ee760e8cbd3a1751d43ca8365fc9bc.jpg" alt="EDM">
      <div class="tile-title">Мой любимый музыкальный жанр</div>
    </div>
    
    <div class="tile">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhLlnDv7GBq4nQr5KVKkS9G1ySL-f-ornyAfhGxZS3Iw&s=10" alt="Mini Cooper JCW 2022 (F56)">
      <div class="tile-title">Езжу за рулём</div>
    </div>
  </div>

</body>
</html>
