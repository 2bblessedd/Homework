<!DOCTYPE html>
<html lang="ru">
<head>
  <style>
    body { background: #000; margin: 20px; }
    
    .flex-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 800px;
      margin: 0 auto;
    }
    
    .b {
      background: #fff;
      border-radius: 12px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="flex-grid">
    <div class="b" style="flex: 0 0 calc(25% - 6px); height: 200px;"></div>
    <div class="b" style="flex: 0 0 calc(25% - 6px); height: 120px;"></div>
    <div class="b" style="flex: 0 0 calc(25% - 6px); height: 120px;"></div>
    <div class="b" style="flex: 0 0 calc(25% - 6px); height: 200px;"></div>
    
    <div class="b" style="flex: 0 0 calc(25% - 6px); height: 90px;"></div>
    <div class="b" style="flex: 0 0 calc(50% - 4px); height: 170px;"></div>
    
    <div class="b" style="flex: 0 0 calc(45% - 5px); height: 110px;"></div>
    <div class="b" style="flex: 0 0 calc(30% - 6px); height: 110px;"></div>
    <div class="b" style="flex: 0 0 calc(25% - 6px); height: 170px;"></div>
  </div>

</body>
</html>
