<!DOCTYPE html>
<html lang="ru">
<head>
  <style>
    body { background: #000; margin: 20px; }
    
    div {
      display: flex;
    }
    
    .horizontal {
      flex-direction: row;
      gap: 8px;
    }

    .vertical {
      flex-direction: column;
      gap: 8px;
    }
    
    .b {
      background: #fff;
      border-radius: 12px;
      height: 150px;
      width: 350px;
    }
  </style>
</head>
<body>

  <div class="horizontal">
    
    <div class="vertical">
      
      <div class="horizontal">
        
        <div class="vertical">
          
          <div class="b" style="height: 100%">
            <p>1</p>
          </div>
          
          <div class="b">
            <p>2</p>
          </div>

        </div>
        
        <div class="vertical">
          
          <div class="horizontal">
            
            <div class="b">
              <p>3</p>
            </div>
            
            <div class="b">
              <p>4</p>
            </div>
          
          </div>
          
          <div class="b" style="width: 100%">
            <p>5</p>
          </div>
        
        </div>
      
      </div>
      
      <div class="horizontal">
        
        <div class="b" style="width: 100%">
          <p>6</p>
        </div>
        
        <div class="b">
          <p>7</p>
        </div>
      
      </div>
    
    </div>
    
    <div class="vertical">
      
      <div class="b" style="height: 100%">
        <p>8</p>
      </div>
      
      <div class="b" style="height: 100%">
        <p>9</p>
      </div>
    
    </div>
  
  </div>

</body>
</html>
